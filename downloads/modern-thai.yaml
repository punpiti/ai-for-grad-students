from: markdown
standalone: true
pdf-engine: xelatex
filters:
  - templates/modern-thai.lua
include-in-header:
  - templates/modern-thai.tex
variables:
  mainfont: THSarabunNew
  mainfontoptions:
    - Path=templates/fonts/
    - Extension=.ttf
    - UprightFont=*
    - BoldFont=*-Bold
  sansfont: THSarabunNew
  sansfontoptions:
    - Path=templates/fonts/
    - Extension=.ttf
    - UprightFont=*
    - BoldFont=*-Bold
  papersize: a4
  geometry:
    - top=24mm
    - bottom=24mm
    - left=25mm
    - right=25mm
  linestretch: 1.2
  colorlinks: true
  linkcolor: BrandBlue
  urlcolor: BrandTeal
